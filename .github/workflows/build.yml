name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Build plugin and run tests
        run: xvfb-run -a bash ./gradlew --no-daemon test jar
