plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = providers.gradleProperty('runeLiteVersion').getOrElse('latest.release')
version = '0.1.0-dev'
configurations {
	developmentRuntime
}

def pluginMainClass = 'com.exportturtle.ExportTurtlePluginLauncher'

dependencies {
	developmentRuntime group: 'net.runelite', name: 'client', version: runeLiteVersion
	developmentRuntime group: 'net.runelite', name: 'jshell', version: runeLiteVersion

	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:4.11.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.exportturtle'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-Xlint:deprecation']
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	destinationDirectory.set(layout.projectDirectory.dir(providers.gradleProperty('developmentOutputDirectory').getOrElse('build/libs')))
	dependsOn tasks.named('testClasses')
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true,
			'RuneLite-Version': configurations.developmentRuntime.resolvedConfiguration.resolvedArtifacts.find {
				it.moduleVersion.id.group == 'net.runelite' && it.name == 'client'
			}.moduleVersion.id.version)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from(sourceSets.test.output) {
		include 'com/exportturtle/ExportTurtlePluginLauncher.class'
	}
	from {
		configurations.developmentRuntime.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
